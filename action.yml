name: 'TestBalloon Reporter'
description: 'Generate KMP test reports'
inputs:
  reports:
    description: 'Glob pattern for XML test results (e.g., **/test-results/**/*.xml)'
    required: false
    default: ' '
  platform-hints:
    description: 'Custom platform hints for specific XML file path patterns. (as JSON)'
    required: false
  platform-hints-file:
    description: 'Custom platform hints for specific XML file path patterns (as a JSON file).'
    required: false
  github-token:
    description: 'GitHub Token for creating Check Runs'
    default: ${{ github.token }}
    required: true
  sha:
    description: 'Target commit SHA to add checks.'
    default: ${{ github.event.pull_request.head.sha || github.sha }}
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Fetch Latest Successful Run ID from Master
      id: get-run-id
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].id')
        echo "latest_run_id=$RUN_ID" >> $GITHUB_OUTPUT
    - name: Download Baseline from Master Branch
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: results.json
        github-token: ${{ inputs.github-token }}
        run-id: ${{ steps.get-run-id.outputs.latest_run_id }}
        path: tmp-baseline-dir
    - name: Flatten Artifact File
      shell: bash
      run: |
        if [ -f "tmp-baseline-dir/results.json" ]; then
          mv tmp-baseline-dir/results.json ./previous-results.json
          rm -rf tmp-baseline-dir
        fi
    - name: Run TestBalloon
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HINTS_JSON: ${{ inputs.platform-hints }}
        COMMIT_SHA: ${{ inputs.sha }}
      shell: bash
      run: |
        java -jar "${{ github.action_path }}/dist/testballoon-all.jar" \
          --reports "${{ inputs.reports }}" \
          --platform-hints "$HINTS_JSON" \
          --platform-hints-file "${{ inputs.platform-hints-file }}" \
          --output summary.md
        cat summary.md >> $GITHUB_STEP_SUMMARY
    - name: Upload results
      uses: actions/upload-artifact@v7
      with:
        path: results.json
        archive: false